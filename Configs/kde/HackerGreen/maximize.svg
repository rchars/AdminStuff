<?xml version="1.0" encoding="UTF-8"?>
<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg">

  <g id="active-center">
    <rect width="20" height="20" fill="none"/>

    <!-- background block (prevents white override visibility issues) -->
    <rect x="3" y="3" width="14" height="14" fill="#003300"/>

    <!-- outer window -->
    <rect x="5" y="5" width="10" height="10"
          fill="none"
          stroke="#00ff33"
          stroke-width="2"/>

    <!-- inner window (maximized "stack" hint) -->
    <rect x="7" y="7" width="10" height="10"
          fill="none"
          stroke="#00ff33"
          stroke-width="2"/>
  </g>

  <g id="inactive-center">
    <rect width="20" height="20" fill="#001a00"/>

    <rect x="5" y="5" width="10" height="10"
          fill="none"
          stroke="#0a5a2a"
          stroke-width="2"/>

    <rect x="7" y="7" width="10" height="10"
          fill="none"
          stroke="#0a5a2a"
          stroke-width="2"/>
  </g>

</svg>
